name: Deploy to N100

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/repairs-tracker
          git pull origin main

      - name: Install dependencies
        run: |
          cd ~/repairs-tracker
          npm ci --omit=dev

      - name: Restart app
        run: |
          pm2 restart repairs-tracker --update-env
          pm2 save
